name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install django-cors-headers channels

      - name: Run Django tests
        env:
          SECRET_KEY: 'django-insecure-test-key-for-ci'
          DEBUG: 'True'
        run: python manage.py test --verbosity=2

      - name: Notify Jira on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue/" \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "fields": {
                "project": {"key": "${{ secrets.JIRA_PROJECT_KEY }}"},
                "summary": "CI Failure (Django): ${{ github.repository }} on ${{ github.ref_name }} [${{ github.sha }}]",
                "description": "Django pipeline failed.\n\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "issuetype": {"name": "Bug"},
                "priority": {"name": "High"}
              }
            }'

  test-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"

      - name: Install dependencies
        run: flutter pub get
        working-directory: plflutter

      - name: Run Flutter tests
        run: flutter test
        working-directory: plflutter

      - name: Notify Jira on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.JIRA_BASE_URL }}/rest/api/2/issue/" \
            -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "fields": {
                "project": {"key": "${{ secrets.JIRA_PROJECT_KEY }}"},
                "summary": "CI Failure (Flutter): ${{ github.repository }} on ${{ github.ref_name }} [${{ github.sha }}]",
                "description": "Flutter pipeline failed.\n\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "issuetype": {"name": "Bug"},
                "priority": {"name": "High"}
              }
            }'

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: [test-django, test-flutter]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DOCR
        run: echo "${{ secrets.DO_API_TOKEN }}" | docker login registry.digitalocean.com -u doctl --password-stdin

      - name: Build and push image
        run: |
          IMAGE=registry.digitalocean.com/${{ secrets.DOCR_REGISTRY }}/${{ github.event.repository.name }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE