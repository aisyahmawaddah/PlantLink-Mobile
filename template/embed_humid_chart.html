{% load compress %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humidity Chart</title>
    <link rel="icon" type="image/x-icon" href="{% static 'main/iconPL.ico' %}">
    {% load bootstrap5 %}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <style>
        .chart-container {
            width: 450px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Humidity Chart</h1>
    <div>
        <label for="chartTypeSelect">Select Chart Type:</label>
        <select id="chartTypeSelect" class="form-select">
            <option value="line">Line Chart</option>
            <option value="spline">Spline Chart</option>
            <option value="bar">Bar Chart</option>
        </select>
    </div>
    <div class="chart-container">
        <div class="d-flex align-items-center gap-2 mt-2 mb-2 flex-wrap" id="datePickerRow">
            <small>From:</small>
            <input type="date" id="startDateInput" class="form-control form-control-sm" style="width:auto;">
            <small>To:</small>
            <input type="date" id="endDateInput" class="form-control form-control-sm" style="width:auto;">
            <button id="applyDateBtn" class="btn btn-sm btn-outline-secondary">Apply</button>
            <button id="clearDateBtn" class="btn btn-sm btn-outline-danger">Clear</button>
        </div>
        <div id="canvas" class="d-flex align-content-start flex-wrap justify-content-between">
            <div id="chart-spinner-container" class="text-center" style="width: 400px; height: 400px; display: none;">
                <div class="spinner-border" role="status">
                    <span class="sr-only"></span>
                </div>
                <div id="chart-loading-message">Graph is being loaded...</div>
            </div>
        </div>
        <div class="d-grid gap-2">
            <button id="download" class="btn btn-primary mt-3">Download Chart as Image</button>
        </div>
    </div>

    <script>
        let humidChart = null;
        let humidData = [];
        let timestamps_temp_humid = [];

        document.addEventListener("DOMContentLoaded", function() {
            const channelId = "{{ channel_id }}";
            const startDate = "{{ start_date }}";
            const endDate = "{{ end_date }}";
            const isLive = "{{ is_live }}" === "True";

            document.getElementById('chart-spinner-container').style.display = 'block';
            document.getElementById('download').style.display = 'none';

            const url = isLive
                ? `https://rathe-Russell-proterandrous.ngrok-free.dev/mychannel/humidity_temperature/${channelId}/all/`
                : `https://rathe-Russell-proterandrous.ngrok-free.dev/mychannel/humidity_temperature/${channelId}/${startDate}/${endDate}/`;

            fetch(url, { headers: { 'ngrok-skip-browser-warning': 'true' } })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('download').style.display = 'block';
                    document.getElementById('chart-spinner-container').style.display = 'none';
                    humidData = data.humid_values || [];
                    timestamps_temp_humid = data.timestamps_humid_temp || [];

                    if (!document.getElementById('humidChart')) {
                        const humidCanvasContainer = document.createElement('div');
                        humidCanvasContainer.className = 'canvas-container';
                        const humidCanvas = document.createElement('canvas');
                        humidCanvas.id = 'humidChart';
                        humidCanvas.width = 450;
                        humidCanvas.height = 400;
                        humidCanvasContainer.appendChild(humidCanvas);
                        document.getElementById('canvas').appendChild(humidCanvasContainer);
                    }

                    humidChart = createChart('humidChart', humidData, timestamps_temp_humid, 'Humidity Value');
                })
                .catch(error => {
                    console.error('Error fetching chart data:', error);
                    document.getElementById('chart-spinner-container').style.display = 'none';
                });

            document.getElementById('chartTypeSelect').addEventListener('change', function() {
                if (humidChart) {
                    humidChart = createChart('humidChart', humidData, timestamps_temp_humid, 'Humidity Value', this.value);
                }
            });

            const wsApiKey = "{{ API }}";
            if (wsApiKey && isLive) {
                const socket = new WebSocket('wss://jzngfcdfgl.execute-api.ap-southeast-2.amazonaws.com/production/');
                socket.onopen = function() {
                    socket.send(JSON.stringify({ action: 'setAPI', api: wsApiKey }));
                };
                socket.onmessage = function(event) {
                    const msg = JSON.parse(event.data);
                    if (msg.privateMessage && msg.privateMessage.sensor_type === 'DHT11') {
                        if (humidChart) {
                            humidChart.data.labels.push(msg.privateMessage.timestamp);
                            humidChart.data.datasets[0].data.push(parseFloat(msg.privateMessage.humidity_value));
                            humidChart.update();
                        }
                    }
                };
            }

            document.getElementById('applyDateBtn').addEventListener('click', function() {
                const s = document.getElementById('startDateInput').value;
                const e = document.getElementById('endDateInput').value;
                if (!s || !e) { alert('Please select both start and end dates.'); return; }
                if (new Date(s) > new Date(e)) { alert('Start date cannot be later than end date.'); return; }
                fetch(`https://rathe-Russell-proterandrous.ngrok-free.dev/mychannel/humidity_temperature/${channelId}/${s}/${e}/`, {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                })
                .then(r => r.json())
                .then(data => {
                    humidData = data.humid_values || [];
                    timestamps_temp_humid = data.timestamps_humid_temp || [];
                    humidChart = createChart('humidChart', humidData, timestamps_temp_humid, 'Humidity Value', document.getElementById('chartTypeSelect').value);
                });
            });

            document.getElementById('clearDateBtn').addEventListener('click', function() {
                document.getElementById('startDateInput').value = '';
                document.getElementById('endDateInput').value = '';
                const clearUrl = isLive
                    ? `https://rathe-Russell-proterandrous.ngrok-free.dev/mychannel/humidity_temperature/${channelId}/all/`
                    : `https://rathe-Russell-proterandrous.ngrok-free.dev/mychannel/humidity_temperature/${channelId}/${startDate}/${endDate}/`;
                fetch(clearUrl, { headers: { 'ngrok-skip-browser-warning': 'true' } })
                .then(r => r.json())
                .then(data => {
                    humidData = data.humid_values || [];
                    timestamps_temp_humid = data.timestamps_humid_temp || [];
                    humidChart = createChart('humidChart', humidData, timestamps_temp_humid, 'Humidity Value', document.getElementById('chartTypeSelect').value);
                });
            });
        });

        function createChart(canvasId, data, labels, label, type = 'line') {
            const chartType = type === 'spline' ? 'line' : type;
            const config = {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        fill: false,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: chartType === 'bar' ? 'rgba(255, 99, 132, 0.2)' : 'rgb(75, 192, 192)',
                    }]
                },
                options: {
                    elements: { line: { tension: type === 'spline' ? 0.4 : 0.1 } },
                    scales: {
                        y: { beginAtZero: false },
                        x: { ticks: { maxRotation: 90, minRotation: 80 } }
                    },
                    responsive: false,
                    maintainAspectRatio: false
                }
            };
            const canvas = document.getElementById(canvasId);
            const chartInstance = Chart.getChart(canvas);
            if (chartInstance) { chartInstance.destroy(); }
            return new Chart(canvas, config);
        }

        document.getElementById('download').addEventListener('click', function() {
            const canvas = document.getElementById('humidChart');
            canvas.toBlob(function(blob) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'chart.jpeg';
                link.click();
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
